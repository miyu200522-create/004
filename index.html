<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css">
<title>iroha</title></head><body>
<header class="topbar"><div class="titleline"><h1>カレンダー</h1><button id="settings" aria-label="設定">⚙</button></div><div class="monthline"><div><h2 id="month"></h2><p id="recordSummary" class="muted"></p></div><div class="monthControls"><button id="todayBtn">今日</button><button id="prev" aria-label="前の月">‹</button><button id="next" aria-label="次の月">›</button></div></div></header>
<main>
<section id="calendarView"><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div><section class="selectedPanel"><div class="selectedHead"><div><h3 id="selectedDateTitle"></h3><p id="selectedDateCount" class="muted"></p></div><button id="openSelected">この日を開く ›</button></div><div id="selectedPhotos" class="selectedPhotos"></div></section></section>
<section id="dayView" hidden><div class="subhead"><button id="back">‹ 戻る</button><strong id="dayTitle"></strong></div><div class="albumWrap"><button id="bookCover" class="albumCover" aria-label="表紙をタップしてアルバムを開く"></button><div id="albumPages" class="albumPages" hidden></div></div></section>
<section id="editDayView" hidden><div class="subhead"><button id="editDayBack">‹ 戻る</button><strong id="editDayTitle"></strong><button id="editDayAdd">＋</button></div><p class="muted editIntro">この日の写真と記録を編集できます。</p><div id="editDayList" class="editDayList"></div></section>
<section id="settingsView" hidden><div class="subhead"><button id="settingsBack">‹ 戻る</button><strong>設定・バックアップ</strong></div>
<p>写真・タグ・メモはこのブラウザ内に保存されます。外部サーバーには送信しない設計です。</p>
<button id="export">バックアップを書き出す</button><button id="importBackup">バックアップを復元</button><input id="backupFile" type="file" accept=".iroha,application/json" hidden>
<p class="muted">バックアップはパスワードで暗号化します。パスワードを忘れると復元できません。定期的に別の安全な場所へ保管してください。</p></section>
<section id="tagView" hidden><div class="subhead"><button id="tagBack">‹ 戻る</button><strong>タグ管理</strong></div><p class="muted">タグを先に登録しておくと、写真の情報を編集するときに選ぶだけで付けられます。</p><div id="tagList"></div><div class="inline"><input id="newTag" placeholder="新しいタグ"><input id="tagColor" type="color" value="#b98b79" aria-label="タグの色"><button id="createTag">追加</button></div></section>
<section id="tagPhotosView" hidden><div class="subhead"><button id="tagPhotosBack">‹ タグ一覧</button><strong id="tagPhotosTitle">タグの写真</strong></div><div id="tagPhotoGrid" class="tagPhotoGrid"></div><p id="tagPhotoEmpty" class="muted" hidden>このタグが付いた写真はまだありません。</p></section>
</main>
<nav class="bottomNav"><button class="active" id="navCalendar">▦<span>カレンダー</span></button><button id="navAdd">▣<span>撮影</span></button><button id="navTags">▤<span>タグ</span></button></nav>
<input id="photos" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" multiple hidden>
<dialog id="addDialog"><form method="dialog" id="addForm"><h2 id="addTitle" tabindex="-1">写真を追加</h2><p class="muted" id="addCount"></p><button type="button" id="addMorePhotos">＋ 写真を追加で選ぶ</button><label>撮影日・時刻<input id="addDate" type="datetime-local" required></label><p class="muted">タグ（複数選択できます）</p><div id="addTags"></div><div class="dialogActions"><button value="cancel">キャンセル</button><button id="confirmAdd" value="add">追加する</button></div></form></dialog>
<dialog id="zoomDialog" class="zoomDialog"><div class="galleryHeader"><span id="galleryDate"></span><button type="button" id="closeZoom" aria-label="閉じる">×</button></div><div id="galleryTrack" class="galleryTrack" aria-label="写真一覧"></div></dialog>
<dialog id="tagEditDialog"><form method="dialog" id="tagEditForm"><h2>タグを編集</h2><label>タグ名<input id="editTagName" required maxlength="30"></label><label>色<input id="editTagColor" type="color"></label><div class="dialogActions"><button value="cancel">キャンセル</button><button value="save" id="saveTagEdit">保存</button></div></form></dialog>
<dialog id="editDialog"><form method="dialog" id="editForm"><h2 id="editTitle" tabindex="-1">写真の情報</h2><label>日時<input id="editDate" type="datetime-local"></label><label>メモ<textarea id="editMemo" rows="3"></textarea></label><p class="muted">タグ</p><div id="editTags"></div><div class="dialogActions"><button value="cancel">閉じる</button><button id="saveEdit" value="save">保存</button><button id="deletePhoto" value="delete" class="danger">削除</button></div></form></dialog>
<script src="app.js"></script></body></html>
